<html>
    <head>
     <link rel="stylesheet" href="style.css">  
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Jacquard+12&display=swap" rel="stylesheet">
     <style>
        .html {
            width: 100vw;
       }
        .body {
            min-width: 100vw;
            max-width: 100vw
        }
        .page {
            min-width: 80%;
            max-width: 100%;
            margin-inline: 1rem;
            margin-bottom:3rem;
            display: flex;
            flex-direction: column;
            object-fit:scale-down;  
            justify-self: centre;
            justify-content: center;
        }
        .topbar { 
    display:flex;
    direction:inline;
    align-items: center;
}
.title {
    margin-inline:auto
}
        .images {
            min-width: 50%;
            display:flex;
            flex-direction: column;
            overflow:none;
            justify-content: center;
            margin-inline:auto;
        }
        .image {
            max-width: 100%;
            justify-self: center;
        }
            .image {
        height:90dvh;
        margin-inline:1rem;
        margin-bottom: 1rem;
        object-fit:scale-down

        }
        .img {
            margin-right:1rem;
            height:80dvh
        }
        .scroll {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            justify-content: space-between;
            height: 100%;
            width:auto;
            max-width:100%;
            object-fit: contain;
        }
        .row {
            display:flex;
            width:100%;
            justify-content: center;
            max-height:90%
        }
        .imag { 
            width:30%;
        }
        .imagp {
            width:35%;
            margin-inline:1rem
        }

.zoom {
    width:20rem;
    height:25rem;
    margin-inline: auto;

    overflow-x: scroll;
    overflow-y: scroll;
    scroll-margin-block-start: 400px;
    scroll-margin-inline-start: 600px;
    scrollbar-width: none;
}
.text {
    text-align: center;
    margin-bottom: 3rem;
}
            @media only screen and (max-width:600px){
.page {
padding-top: 2rem;
margin-inline:2rem
}
.scroll {
    height:min-content;
    object-fit: contain;
}
.img {
    margin-right:.6rem;
    width:auto;
    height: 30rem;
        }
}
@media  (max-width: 1024px) {
    body {
max-width: 100dvw;
overflow-x: hidden;
}
.image {
    max-height:85dvh;
    height:min-content;
    width:70dvw
}
.img {
    max-width:80dvw;
    height:40dvh
}
.scroll {
    margin-left:2rem
}
.imag {
    width:100dvw;
    height:auto;
    max-height:70dvh;
    margin-inline: 1rem;
    padding-inline:1rem
}
.imagp {
    width:70dvw;
    height:auto;
    max-height:70dvh;
    margin-inline: 1rem;
    padding-inline:1rem
}
.row {
    max-height:80dvh;
    width:90dvw;
    display: flex;
    flex-wrap: nowrap;
    justify-content:space-around;
    overflow-x: scroll;
    object-fit: scale-down;
    scrollbar-width: none;
    margin-left:2rem
}
}

     </style> 
</head>

 <img src="portfolio/illustrations/preciouspink2.png" class="image">
